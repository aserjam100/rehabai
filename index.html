<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Rehab Coach</title>
  <style>
    /* Soothing dark-on-light palette (per CLAUDE.md: "dark on light, no
       thin weights") -- warm off-white background, slate text, muted
       sage accent. Replaces the neon green-on-black used while building
       Steps 1-4; too jarring for a senior-facing app. */
    :root {
      --bg: #f4f1ea;
      --ink: #2c3e42;
      --accent: #4a7c66;
      --stop: #b5533c;
      --muted: #7a8785;
    }
    body {
      margin: 0;
      background: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    /* Mirroring convention: #stage is CSS-flipped so the feed acts like a
       mirror. Video and canvas are children of the same flipped container,
       so drawn landmarks stay aligned with the video without flipping
       landmark math itself. */
    #stage {
      position: relative;
      transform: scaleX(-1);
    }
    #stage video, #stage canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      color: var(--ink);
      background: var(--bg);
      font: bold 32px monospace;
      padding: 10px 16px;
      z-index: 10;
      white-space: pre;
    }
    #dashboard {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      color: var(--ink);
      background: var(--bg);
      font: bold 28px monospace;
      padding: 10px 16px;
      z-index: 10;
      white-space: pre;
    }
    #stopBtn {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      min-width: 200px;
      min-height: 80px;
      font: bold 28px sans-serif;
      background: var(--stop);
      color: #fff;
      border: none;
      z-index: 20;
    }
    #exerciseScreen {
      display: none;
    }
    /* Exercise demonstration (replaces the originally-planned webcam-
       keyframe stick figure -- see CLAUDE.md's Step 6 amendment). Static
       images supplied externally by the user (generated outside the app;
       never fetched from any API at runtime, so the locked "no cloud
       APIs" rule stays intact) sit beside the live feed since #exercise-
       Screen uses display:contents, making #demoPanel a sibling flex item
       of #stage under the same body-level flex row. Whichever pose the
       senior should currently emulate is highlighted; the rest are dimmed. */
    #demoPanel {
      display: none;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      margin-right: 24px;
    }
    .demoItem {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .demoImg {
      width: 190px;
      height: 190px;
      object-fit: contain;
      background: #fff;
      border: 3px solid var(--muted);
      border-radius: 8px;
      opacity: 0.5;
      transition: opacity 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
    }
    .demoImg.highlight {
      opacity: 1;
      border-color: var(--accent);
      transform: scale(1.08);
    }
    .demoLabel {
      font-size: 16px;
      font-weight: bold;
      color: var(--ink);
    }
    #greeting {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      color: var(--ink);
      font-family: monospace;
      text-align: center;
      padding: 40px;
    }
    #greetingText {
      font-size: 32px;
      font-weight: bold;
      max-width: 900px;
    }
    #nameInput {
      display: none;
      font-size: 28px;
      padding: 12px;
      min-height: 60px;
      min-width: 400px;
      text-align: center;
      color: var(--ink);
      border: 2px solid var(--ink);
      background: #fff;
    }
    #startBtn {
      min-width: 200px;
      min-height: 80px;
      font: bold 32px sans-serif;
      background: var(--accent);
      color: #fff;
      border: none;
    }
    #startBtn:disabled {
      background: var(--muted);
      cursor: not-allowed;
    }
    #replayBtn {
      display: none;
      min-width: 60px;
      min-height: 60px;
      font-size: 28px;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
    }
    /* Discreet dev/demo control -- deliberately breaks the "words not
       icons" and sizing rules that apply to the senior-facing controls,
       since this one is never meant to be seen or used by the patient. */
    #resetBtn {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      line-height: 1;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--muted);
      border-radius: 50%;
      z-index: 30;
      cursor: pointer;
    }
    /* Language toggle IS for the patient -- deliberately larger/clearer
       than the reset dot. Cycles through the 4 languages on tap; no
       dropdown, per CLAUDE.md's "no dropdowns" rule. Lives top-right next
       to the reset dot (not top-left) -- top-left overlapped the status/
       exercise text on the exercise screen, which spans the full width. */
    #langToggleBtn {
      position: fixed;
      top: 12px;
      right: 52px;
      min-width: 90px;
      min-height: 44px;
      font: bold 18px sans-serif;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
      z-index: 30;
      cursor: pointer;
    }
    #languageChoice {
      display: none;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .langOption {
      min-width: 140px;
      min-height: 56px;
      font: bold 20px sans-serif;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
      cursor: pointer;
    }
    .langOption.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    /* Age range: same onboarding-only, button-group pattern as the
       language picker -- captured once next to name, never shown again
       after (per user decision: not an always-editable toggle like
       language). Separate class from .langOption purely so the two
       pickers' selection state can't collide; the CSS is identical. */
    #subPrompt {
      display: none;
      font-size: 24px;
      font-weight: bold;
    }
    #ageChoice {
      display: none;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .ageOption {
      min-width: 140px;
      min-height: 56px;
      font: bold 20px sans-serif;
      background: #fff;
      color: var(--ink);
      border: 2px solid var(--ink);
      cursor: pointer;
    }
    .ageOption.selected {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    /* History surface (scoped exception to the "no charts" rule -- see
       CLAUDE.md's "Technical decisions" section for the exact scope):
       a small canvas bar chart of rep counts across recent sessions,
       shown only to returning users who have at least 2 sessions logged.
       Drawn with the same plain-canvas approach as the pose overlay --
       no charting library, per the locked stack. Fixed bottom-right so
       it reads as secondary info, not competing with the greeting text
       and START button for the center of attention. */
    #progressSection {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: fixed;
      bottom: 20px;
      right: 20px;
      max-width: 340px;
      text-align: center;
      z-index: 15;
    }
    #progressLabel {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    #progressExercise {
      font-size: 16px;
      color: var(--muted);
    }
    #progressCanvas {
      background: #fff;
      border: 2px solid var(--ink);
    }
    #progressCaption {
      font-size: 18px;
      font-style: italic;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <button id="langToggleBtn" title="Change language">EN</button>

  <div id="greeting">
    <div id="greetingText">Loading...</div>
    <div id="languageChoice">
      <button class="langOption" data-lang="en">English</button>
      <button class="langOption" data-lang="ms">Bahasa Melayu</button>
      <button class="langOption" data-lang="ta">தமிழ்</button>
      <button class="langOption" data-lang="zh">中文</button>
    </div>
    <input id="nameInput" type="text" placeholder="Your name" />
    <div id="subPrompt"></div>
    <div id="ageChoice">
      <button class="ageOption" data-age="under60">Under 60</button>
      <button class="ageOption" data-age="60-69">60-69</button>
      <button class="ageOption" data-age="70-79">70-79</button>
      <button class="ageOption" data-age="80+">80+</button>
    </div>
    <div id="progressSection">
      <div id="progressLabel"></div>
      <div id="progressExercise"></div>
      <canvas id="progressCanvas" width="320" height="180"></canvas>
      <div id="progressCaption"></div>
    </div>
    <button id="startBtn" disabled>START</button>
    <button id="replayBtn" title="Replay greeting">&#128266;</button>
  </div>

  <div id="exerciseScreen">
    <div id="status">starting...</div>
    <div id="dashboard"></div>
    <div id="demoPanel">
      <div class="demoItem">
        <img id="demoIdle" class="demoImg" alt="" />
        <div class="demoLabel" id="demoIdleLabel"></div>
      </div>
      <div class="demoItem">
        <img id="demoRight" class="demoImg" alt="" />
        <div class="demoLabel" id="demoRightLabel"></div>
      </div>
      <div class="demoItem">
        <img id="demoLeft" class="demoImg" alt="" />
        <div class="demoLabel" id="demoLeftLabel"></div>
      </div>
    </div>
    <div id="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <button id="stopBtn">STOP</button>
  </div>

  <button id="resetBtn" title="Reset app data">&#8635;</button>

  <script type="module" src="renderer.js"></script>
</body>
</html>
